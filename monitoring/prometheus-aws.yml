# =============================================================
# PROMETHEUS CONFIGURATION - Rapid Delivery Service (AWS / Production)
# =============================================================
# This config targets services using AWS service discovery or ECS
# Container names. Same dashboard JSON works for both local and AWS.
#
# USAGE: Mount this as /etc/prometheus/prometheus.yml in the
# Prometheus container deployed alongside your ECS services.
# =============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # --- Availability Service ---
  # Inventory stock gauges updated by background thread every 30s
  - job_name: 'availability-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['availability-service:8000']
        labels:
          service: 'availability'
          env: 'production'

  # --- Order Service ---
  - job_name: 'order-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['order-service:8001']
        labels:
          service: 'orders'
          env: 'production'

  # --- Fulfillment Worker ---
  - job_name: 'fulfillment-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['fulfillment-worker:8002']
        labels:
          service: 'fulfillment'
          env: 'production'

  # --- Redis Exporter ---
  # For AWS ElastiCache: point REDIS_ADDR to your ElastiCache endpoint
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          env: 'production'

  # --- PostgreSQL Exporter ---
  # For AWS RDS: point DATA_SOURCE_NAME to your RDS endpoint
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          env: 'production'

  # --- Prometheus self-monitoring ---
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
