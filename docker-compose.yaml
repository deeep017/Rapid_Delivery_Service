# =============================================================
# DOCKER COMPOSE - Rapid Delivery Service (AWS/Production Ready)
# =============================================================
# Includes: Databases, Microservices, Monitoring (Prometheus + Grafana)
#
# Same dashboard.json works for both local and production.
# =============================================================

services:
  
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: opensearch
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Admin@123
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped

  # =====================================================
  # MICROSERVICES
  # =====================================================
  availability-service:
    build: ./availability-service
    container_name: availability-service
    ports:
      - "8000:8000"
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENV=${ENV:-prod}
      - MAX_DELIVERY_DISTANCE_KM=${MAX_DELIVERY_DISTANCE_KM:-30.0}
      - LOW_STOCK_THRESHOLD=${LOW_STOCK_THRESHOLD:-20}
    depends_on:
      - redis
      - opensearch
    restart: unless-stopped

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8001:8001"
    environment:
      - ENV=${ENV:-prod}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASS=password
      - SQS_QUEUE_URL=${SQS_QUEUE_URL:-}
      - SNS_TOPIC_ARN=${SNS_TOPIC_ARN:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    depends_on:
      - postgres
    restart: unless-stopped

  fulfillment-worker:
    build: ./fulfillment-worker
    container_name: fulfillment-worker
    ports:
      - "8002:8002"
    environment:
      - ENV=${ENV:-prod}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - SQS_QUEUE_URL=${SQS_QUEUE_URL:-}
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASS=password
      - DB_NAME=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # =====================================================
  # MONITORING STACK (same dashboard for local + AWS)
  # =====================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: rapid_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus-aws.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    depends_on:
      - availability-service
      - order-service
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: rapid_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-rapid123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/rapid-delivery-dashboard.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./local/grafana/provisioning:/etc/grafana/provisioning
      - ./local/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: rapid_redis_exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: rapid_postgres_exporter
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:password@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  opensearch_data:
  prometheus_data:
  grafana_data:
